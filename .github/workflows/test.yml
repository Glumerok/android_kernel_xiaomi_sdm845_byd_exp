name: Build BYD-Kernel For Xiaomi 8 EE & UD
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update -y 
        sudo apt install -y binutils make python2 libssl-dev flex unzip ca-certificates xz-utils mkbootimg cpio device-tree-compiler git bc bison build-essential ccache curl g++-multilib gcc-multilib gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        
    - name: Clone compiler
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git
    
    - name: Build Kernel
      run: |
        sudo ln -sf /usr/bin/python2.7 /usr/bin/python
        export PATH=$PATH:$(pwd)/proton-clang/bin
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export ARCH=arm64
        
        # Пробуем найти конфиг
        ls -la arch/arm64/configs/
        
        # Если конфиг существует - собираем
        if [ -f "arch/arm64/configs/ursa_xiaomi_sdm845_ksu_defconfig" ]; then
          make O=out ursa_xiaomi_sdm845_ksu_defconfig
          make O=out -j$(nproc --all) || echo "Build failed but continuing..."
        else
          echo "Config not found, trying default config"
          make O=out defconfig
          make O=out -j4 || echo "Build failed"
        fi
        
        # Проверяем результат
        ls -la out/arch/arm64/boot/
        
    - name: Upload any results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kernel-build-results
        path: |
          out/arch/arm64/boot/
          kernel_log*.txt
